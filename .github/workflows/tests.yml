name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin marketplace
        run: python -c "import json; m=json.load(open('.claude-plugin/marketplace.json')); import os; [os.path.isfile(s.lstrip('./')+'/SKILL.md') or exit('missing '+s) for p in m['plugins'] for s in p['skills']]"
      - name: Run tests (mocked voice engine, no API key)
        run: python -m unittest discover -s tests -v
